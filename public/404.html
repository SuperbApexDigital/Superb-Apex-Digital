<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting – Superb Apex Digital</title>
    <script>
      // Single Page Application redirect script for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var hostname = window.location.hostname;
        var isGitHubPages = hostname.endsWith('github.io');
        
        var segments = path.split('/').filter(Boolean);
        var basePrefix = '';
        var cleanPath = '';

        if (isGitHubPages && segments.length > 0) {
          var repoName = segments[0];
          basePrefix = '/' + repoName;
          cleanPath = segments.slice(1).join('/');
        } else {
          cleanPath = segments.join('/');
        }

        cleanPath = cleanPath.replace(/^index\.html\/?/i, '');
        
        var query = window.location.search || '';
        var hash = window.location.hash || '';
        
        var target = (basePrefix ? (basePrefix + '/') : '/') + '#/' + cleanPath + query + hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 40px; background: #0B0F14; color: #F5F7FA;">
    <p>Navigating to Superb Apex Digital...</p>
    <noscript>
      <p>Please click <a href="./#/" style="color: #6C8CFF;">here</a> to continue to the homepage.</p>
    </noscript>
  </body>
</html>
