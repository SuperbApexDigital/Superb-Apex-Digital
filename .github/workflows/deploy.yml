name: Deploy Superb Apex Digital to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Build production site
        run: npm run build
        env:
          # Automatically uses GitHub Pages base path, falling back to '/superb-apex-digital/'
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/superb-apex-digital' }}/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
